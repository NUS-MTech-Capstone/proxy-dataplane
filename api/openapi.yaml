openapi: 3.1.0
info:
  title: DenDenMushi Proxy Dataplane API
  version: 0.1.0
  description: Runtime API for dataplane health, terminal WebSocket upgrade, and automation operations. Business endpoints require the `x-api-version: 1` header; browser WebSocket upgrades may use `apiVersion=1` in the query string because browsers cannot set custom WebSocket headers. Probe, OpenAPI, and AsyncAPI endpoints are exempt.
servers:
  - url: http://localhost:8083
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Service is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /sessions/{sessionId}/ws:
    get:
      summary: Upgrade to a terminal WebSocket
      description: Binary terminal packet protocol is documented in api/asyncapi.yaml and served from /asyncapi.yaml.
      security:
        - albCognito: []
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: Session token fallback when Authorization cannot be supplied during WebSocket upgrade.
      responses:
        "101":
          description: WebSocket upgrade accepted.
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /automation/runs/{runId}/operations:
    post:
      summary: Execute a bounded automation operation
      security:
        - bearerAuth: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationRequest"
      responses:
        "200":
          description: Operation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    albCognito:
      type: apiKey
      in: header
      name: x-amzn-oidc-data
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Structured error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
    OperationRequest:
      type: object
      required: [operationId]
      additionalProperties: false
      properties:
        operationId:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
        planHash:
          type: string
    OperationResult:
      type: object
      required: [operationId, stdout, stderr, exitCode]
      properties:
        operationId:
          type: string
        stdout:
          type: string
        stderr:
          type: string
        exitCode:
          type: integer
